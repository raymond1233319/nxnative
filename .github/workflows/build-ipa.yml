name: Build IPA from Google Drive

on:
  workflow_dispatch:
    inputs:
      google_drive_file_id:
        description: Google Drive file ID, or comma-separated file IDs for the base game, updates, and DLC
        required: true
        type: string
      title_id:
        description: 16-digit base-game title ID, required for an XCI without a title ID in its filename
        required: false
        type: string
      language:
        description: Game language code, such as ja, fr, de, zh-Hans, or en-US
        required: false
        default: zh-Hant
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/workflows/build-ipa.yml

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install build tools
        run: brew install xcodegen zstd glslang

      - name: Install Python packages
        run: python -m pip install lz4 capstone fonttools nsz google-api-python-client google-auth

      - name: Download game package from Google Drive
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_B64 }}
          GOOGLE_DRIVE_FILE_ID: ${{ inputs.google_drive_file_id }}
          GOOGLE_DRIVE_TITLE_ID: ${{ inputs.title_id }}
        run: |
          : "${GOOGLE_DRIVE_SERVICE_ACCOUNT_B64:?Set the GOOGLE_DRIVE_SERVICE_ACCOUNT_B64 repository secret}"
          : "${GOOGLE_DRIVE_FILE_ID:?Enter a Google Drive file ID when dispatching the workflow}"
          mkdir -p "$RUNNER_TEMP/game"
          printf '%s' "$GOOGLE_DRIVE_SERVICE_ACCOUNT_B64" | base64 -D > "$RUNNER_TEMP/service-account.json"
          IFS=',' read -ra FILE_IDS <<< "$GOOGLE_DRIVE_FILE_ID"
          for file_id in "${FILE_IDS[@]}"; do
            file_id="${file_id//[[:space:]]/}"
            python - "$RUNNER_TEMP/service-account.json" "$file_id" "$RUNNER_TEMP/game" "$GOOGLE_DRIVE_TITLE_ID" <<'PY'
          import pathlib
          import re
          import sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          key_path, file_id, output_dir, title_id = sys.argv[1:]
          credentials = service_account.Credentials.from_service_account_file(
              key_path,
              scopes=["https://www.googleapis.com/auth/drive.readonly"],
          )
          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)
          metadata = drive.files().get(
              fileId=file_id,
              fields="name,mimeType",
              supportsAllDrives=True,
          ).execute()
          if metadata.get("mimeType", "").startswith("application/vnd.google-apps."):
              raise SystemExit("Google Drive files created by an editor cannot be downloaded as NSP/XCI data")
          destination = pathlib.Path(output_dir) / pathlib.Path(metadata["name"]).name
          request = drive.files().get_media(fileId=file_id, supportsAllDrives=True)
          with destination.open("wb") as stream:
              downloader = MediaIoBaseDownload(stream, request, chunksize=64 * 1024 * 1024)
              done = False
              while not done:
                  _, done = downloader.next_chunk()
          with destination.open("rb") as stream:
              header = stream.read(0x104)
          suffix = destination.suffix.lower()
          if header[:4] == b"PFS0":
              expected = suffix if suffix in {".nsp", ".nsz"} else ".nsp"
          elif header[0x100:0x104] == b"HEAD":
              expected = suffix if suffix in {".xci", ".xcz"} else ".xci"
          else:
              raise SystemExit(
                  f"Downloaded file is not an NSP/XCI package: {destination.name} "
                  f"(first bytes: {header[:4].hex()}, bytes at 0x100: {header[0x100:0x104].hex()})"
              )
          normalized = destination.with_suffix(expected)
          if expected == ".xci" and not re.search(r"\[[0-9A-Fa-f]{16}\]$", normalized.stem):
              if not re.fullmatch(r"[0-9A-Fa-f]{16}", title_id):
                  raise SystemExit("XCI filename has no title ID; dispatch again with the 16-digit title_id input")
              normalized = normalized.with_name(f"{normalized.stem} [{title_id.upper()}]{normalized.suffix}")
          if normalized != destination:
              destination.rename(normalized)
          print(f"Downloaded package: {normalized.name}")
          PY
          done
          mkdir -p "$RUNNER_TEMP/output"

      - name: Build unsigned IPA
        env:
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS_BASE64 }}
          GAME_LANGUAGE: ${{ inputs.language }}
        run: |
          : "${PROD_KEYS_B64:?Set the PROD_KEYS_BASE64 repository secret}"
          printf '%s' "$PROD_KEYS_B64" | base64 -D > "$RUNNER_TEMP/prod.keys"
          args=("$RUNNER_TEMP/game" -k "$RUNNER_TEMP/prod.keys" -o "$RUNNER_TEMP/output/game.ipa")
          if [[ -n "$GAME_LANGUAGE" ]]; then
            args+=(--language "$GAME_LANGUAGE")
          fi
          python scripts/build_ipa_from_nsp.py "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nxnative-ipa
          path: ${{ runner.temp }}/output/game.ipa
          if-no-files-found: error
          retention-days: 7
